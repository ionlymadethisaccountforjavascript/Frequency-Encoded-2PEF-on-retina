[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retinafe"
version = "0.1.0"
description = "Frequency-encoded two-photon retinal fluorescence simulation and unmixing"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Aarush Mandala"},
  {name = "Youbin Duan"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "PyYAML>=6.0",
  "scikit-image>=0.21"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
retinafe = "fe2pef_retina.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
